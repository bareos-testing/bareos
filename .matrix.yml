OS:
  Sanitize:
    "F45":
      TYPE: scripted
      IMAGE: fedora45
      BUILD_SCRIPT: bareos/devtools/build-and-test-with-sanitize.sh
      FINISH_SCRIPT: CD/sanitize/finish-sanitize.sh
      ARCH:
        - x86_64
  ULC_rpm:
    "OpenSSL_3.0":
      TYPE: scripted
      IMAGE: "rhel9"
      BUILD_SCRIPT: CD/rpm/build-ulc.sh
      FINISH_SCRIPT: CD/rpm/finish-ulc.sh
      CUSTOM_TEST_IMAGES: [ SLE-15_sp6 ]
      ARCH:
        - x86_64
  Ubuntu:
    "26.04":
      TYPE: deb
      IMAGE: "ubuntu26.04"
      ARCH:
        - x86_64
  SUSE:
    "16":
      TYPE: rpm
      IMAGE: sle160
      CUSTOM_TEST_IMAGES: [ SLE-16.0 ]
      ARCH:
      - x86_64
  Fedora:
    "45":
      TYPE: rpm
      IMAGE: fedora45
      ARCH:
      - x86_64
  Debian:
    "13":
      TYPE: deb
      IMAGE: "debian13"
      ARCH:
        - x86_64
  EL:
    "10":
      TYPE: rpm
      IMAGE: rhel10
      CUSTOM_TEST_IMAGES: [ RHEL ]
      ARCH:
        - x86_64
  FreeBSD:
    "15":
      TYPE: freebsd
      ARCH:
        - amd64
  win:
    native:
      TYPE: win-native
      BUILD_SCRIPT: CD/windows/build-ninja.bat
      STAGES:
        - win-native-64-release
      ARCH:
       - x86_64
      WINVERSIONS:
         - windows-11-64
